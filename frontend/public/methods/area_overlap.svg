<svg xmlns="http://www.w3.org/2000/svg" class="uwfig" width="434" height="246" viewBox="0 0 434 246" role="img" aria-label="Splitting a polygon by area"><style>
.uwfig { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#333333; --muted:#898781; --rule:#c3c2b7; --cell:#efefef;
  --pt:#bfbfbf; --src:#eb6834; --src-fill:#fbd9cb; --tgt:#2a78d6; --tgt-fill:#cde2fb; --sel:#9ec5f4;
  --axis-x:#d03b3b; --axis-y:#008300; --hatch:#c3c2b7 }
@media (prefers-color-scheme: dark) { .uwfig { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
  --rule:#52514e; --cell:#2c2c2a; --pt:#52514e; --src:#d95926; --src-fill:#5a2a17; --tgt:#3987e5;
  --tgt-fill:#1c3a5e; --sel:#256abf; --axis-x:#e66767; --axis-y:#0ca30c; --hatch:#52514e } }
.uwfig text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 10.5px }
.uwfig .title { fill: var(--ink); font-size: 13px; font-weight: 600 }
.uwfig .cap { fill: var(--ink2); font-size: 11px }
.uwfig .cap-b { fill: var(--ink); font-size: 11px; font-weight: 600 }
.uwfig .lbl { fill: var(--ink); font-size: 10.5px; paint-order: stroke; stroke: var(--surface); stroke-width: 3px }
.uwfig .small { fill: var(--muted); font-size: 9.5px }
.uwfig .val { fill: var(--ink); font-size: 9px; paint-order: stroke; stroke: var(--surface); stroke-width: 2.5px }
.uwfig .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: var(--ink2) }
</style><defs><pattern id="fig-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--surface)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--hatch)" stroke-width="2"/></pattern><marker id="fig-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--ink2)"/></marker></defs><rect width="434" height="246" fill="var(--surface)"/><text class="title" x="4" y="17">Splitting a polygon by area</text><g transform="translate(4.0,26.0)"><rect width="230" height="130" rx="6" fill="var(--surface)" stroke="var(--rule)"/><path d="M130.6,111.8L130.6,18.2L37.1,18.2L37.1,111.8L130.6,111.8Z" fill="var(--tgt-fill)" fill-opacity="1.0" stroke="var(--tgt)" stroke-width="1.8" fill-rule="evenodd" stroke-linejoin="round"></path><text class="lbl" x="43.3" y="34.7" text-anchor="start">A</text><path d="M192.9,111.8L192.9,49.4L130.6,49.4L130.6,111.8L192.9,111.8Z" fill="var(--tgt-fill)" fill-opacity="1.0" stroke="var(--tgt)" stroke-width="1.8" fill-rule="evenodd" stroke-linejoin="round"></path><text class="lbl" x="186.7" y="111.1" text-anchor="end">B</text><path d="M192.9,49.4L192.9,18.2L130.6,18.2L130.6,49.4L192.9,49.4Z" fill="var(--tgt-fill)" fill-opacity="1.0" stroke="var(--tgt)" stroke-width="1.8" fill-rule="evenodd" stroke-linejoin="round"></path><text class="lbl" x="186.7" y="34.7" text-anchor="end">C</text><path d="M68.2,96.2L169.6,88.4L177.4,30.7L83.8,33.8L68.2,96.2Z" fill="var(--src-fill)" fill-opacity="0.7" stroke="var(--src)" stroke-width="1.8" fill-rule="evenodd" stroke-linejoin="round"></path><text class="lbl" x="103.6" y="66.6" text-anchor="middle">0.57</text><text class="lbl" x="151.4" y="72.9" text-anchor="middle">0.29</text><text class="lbl" x="153.3" y="44.8" text-anchor="middle">0.14</text></g><text class="cap-b" x="6.0" y="170.0">area_overlap</text><text class="cap" x="6.0" y="183.0">area_overlap splits the source among</text><text class="cap" x="6.0" y="196.0">the targets it overlaps:</text><text class="cap" x="6.0" y="209.0">allocation_fraction is each target&#x27;s</text><text class="cap" x="6.0" y="222.0">share of the source, overlap_measure</text><text class="cap" x="6.0" y="235.0">the area in m².</text><g transform="translate(250.0,26.0)"><rect width="180" height="130" rx="6" fill="var(--surface)" stroke="var(--rule)"/><path d="M104.4,108.3L104.4,21.7L17.8,21.7L17.8,108.3L104.4,108.3Z" fill="var(--tgt-fill)" fill-opacity="1" stroke="var(--tgt)" stroke-width="1.8" fill-rule="evenodd" stroke-linejoin="round"></path><text class="lbl" x="23.6" y="37.2" text-anchor="start">A</text><path d="M162.2,108.3L162.2,50.6L104.4,50.6L104.4,108.3L162.2,108.3Z" fill="var(--tgt-fill)" fill-opacity="0.35" stroke="var(--tgt)" stroke-width="1.8" fill-rule="evenodd" stroke-linejoin="round"></path><text class="lbl" x="156.4" y="108.0" text-anchor="end">B</text><path d="M162.2,50.6L162.2,21.7L104.4,21.7L104.4,50.6L162.2,50.6Z" fill="var(--tgt-fill)" fill-opacity="0.35" stroke="var(--tgt)" stroke-width="1.8" fill-rule="evenodd" stroke-linejoin="round"></path><text class="lbl" x="156.4" y="37.2" text-anchor="end">C</text><path d="M46.7,93.9L140.6,86.7L147.8,33.2L61.1,36.1L46.7,93.9Z" fill="var(--src-fill)" fill-opacity="0.7" stroke="var(--src)" stroke-width="1.8" fill-rule="evenodd" stroke-linejoin="round"></path><text class="lbl" x="99.4" y="65.4" text-anchor="middle">1.00</text></g><text class="cap-b" x="252.0" y="170.0">largest_overlap</text><text class="cap" x="252.0" y="183.0">largest_overlap sends the</text><text class="cap" x="252.0" y="196.0">whole source to the target it</text><text class="cap" x="252.0" y="209.0">overlaps most (A).</text></svg>