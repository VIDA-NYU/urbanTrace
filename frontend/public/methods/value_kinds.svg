<svg xmlns="http://www.w3.org/2000/svg" class="uwfig" width="620" height="233" viewBox="0 0 620 233" role="img" aria-label="Three kinds of value, three ways to move them"><style>
.uwfig { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#333333; --muted:#898781; --rule:#c3c2b7; --cell:#efefef;
  --pt:#bfbfbf; --src:#eb6834; --src-fill:#fbd9cb; --tgt:#2a78d6; --tgt-fill:#cde2fb; --sel:#9ec5f4;
  --axis-x:#d03b3b; --axis-y:#008300; --hatch:#c3c2b7 }
@media (prefers-color-scheme: dark) { .uwfig { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
  --rule:#52514e; --cell:#2c2c2a; --pt:#52514e; --src:#d95926; --src-fill:#5a2a17; --tgt:#3987e5;
  --tgt-fill:#1c3a5e; --sel:#256abf; --axis-x:#e66767; --axis-y:#0ca30c; --hatch:#52514e } }
.uwfig text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 10.5px }
.uwfig .title { fill: var(--ink); font-size: 13px; font-weight: 600 }
.uwfig .cap { fill: var(--ink2); font-size: 11px }
.uwfig .cap-b { fill: var(--ink); font-size: 11px; font-weight: 600 }
.uwfig .lbl { fill: var(--ink); font-size: 10.5px; paint-order: stroke; stroke: var(--surface); stroke-width: 3px }
.uwfig .small { fill: var(--muted); font-size: 9.5px }
.uwfig .val { fill: var(--ink); font-size: 9px; paint-order: stroke; stroke: var(--surface); stroke-width: 2.5px }
.uwfig .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: var(--ink2) }
</style><defs><pattern id="fig-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--surface)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--hatch)" stroke-width="2"/></pattern><marker id="fig-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--ink2)"/></marker></defs><rect width="620" height="233" fill="var(--surface)"/><text class="title" x="4" y="17">Three kinds of value, three ways to move them</text><g transform="translate(4.0,26.0)"><rect width="200" height="130" rx="6" fill="var(--surface)" stroke="var(--rule)"/><path d="M115.6,111.8L115.6,18.2L22.1,18.2L22.1,111.8L115.6,111.8Z" fill="var(--tgt-fill)" fill-opacity="1.0" stroke="var(--tgt)" stroke-width="1.8" fill-rule="evenodd" stroke-linejoin="round"></path><text class="lbl" x="31.4" y="34.7" text-anchor="start">A</text><path d="M177.9,111.8L177.9,18.2L115.6,18.2L115.6,111.8L177.9,111.8Z" fill="var(--tgt-fill)" fill-opacity="1.0" stroke="var(--tgt)" stroke-width="1.8" fill-rule="evenodd" stroke-linejoin="round"></path><text class="lbl" x="124.9" y="34.7" text-anchor="start">B</text><path d="M146.8,96.2L146.8,33.8L53.2,33.8L53.2,96.2L146.8,96.2Z" fill="var(--src-fill)" fill-opacity="0.75" stroke="var(--src)" stroke-width="1.8" fill-rule="evenodd" stroke-linejoin="round"></path><text class="lbl" x="84.4" y="69.0" text-anchor="middle">67</text><text class="lbl" x="131.2" y="69.0" text-anchor="middle">33</text></g><text class="cap-b" x="6.0" y="170.0">Extensive: split</text><text class="cap" x="6.0" y="183.0">Extensive values (people,</text><text class="cap" x="6.0" y="196.0">crashes) are split: a tract of</text><text class="cap" x="6.0" y="209.0">100 people lying 67% in A gives A</text><text class="cap" x="6.0" y="222.0">67 people.</text><g transform="translate(220.0,26.0)"><rect width="200" height="130" rx="6" fill="var(--surface)" stroke="var(--rule)"/><path d="M177.9,111.8L177.9,18.2L22.1,18.2L22.1,111.8L177.9,111.8Z" fill="var(--tgt-fill)" fill-opacity="1.0" stroke="var(--tgt)" stroke-width="1.8" fill-rule="evenodd" stroke-linejoin="round"></path><text class="lbl" x="31.4" y="34.7" text-anchor="start">A</text><path d="M139.0,111.8L139.0,18.2L22.1,18.2L22.1,111.8L139.0,111.8Z" fill="var(--src-fill)" fill-opacity="0.55" stroke="var(--src)" stroke-width="1.8" fill-rule="evenodd" stroke-linejoin="round"></path><path d="M177.9,111.8L177.9,18.2L139.0,18.2L139.0,111.8L177.9,111.8Z" fill="var(--src-fill)" fill-opacity="0.95" stroke="var(--src)" stroke-width="1.8" fill-rule="evenodd" stroke-linejoin="round"></path><text class="lbl" x="79.7" y="69.0" text-anchor="middle">20°</text><text class="lbl" x="157.7" y="69.0" text-anchor="middle">30°</text><text class="lbl" x="100.0" y="103.3" text-anchor="middle">A: 22.5°</text></g><text class="cap-b" x="222.0" y="170.0">Intensive: averaged</text><text class="cap" x="222.0" y="183.0">Intensive values (temperature,</text><text class="cap" x="222.0" y="196.0">income) are averaged, weighted by</text><text class="cap" x="222.0" y="209.0">the overlap: 20° over 3/4 of A</text><text class="cap" x="222.0" y="222.0">and 30° over 1/4 gives 22.5°.</text><g transform="translate(436.0,26.0)"><rect width="180" height="130" rx="6" fill="var(--surface)" stroke="var(--rule)"/><path d="M162.2,108.3L162.2,21.7L17.8,21.7L17.8,108.3L162.2,108.3Z" fill="var(--tgt-fill)" fill-opacity="1.0" stroke="var(--tgt)" stroke-width="1.8" fill-rule="evenodd" stroke-linejoin="round"></path><text class="lbl" x="26.4" y="37.2" text-anchor="start">A</text><path d="M104.4,108.3L104.4,21.7L17.8,21.7L17.8,108.3L104.4,108.3Z" fill="var(--cell)" fill-opacity="1.0" stroke="var(--rule)" stroke-width="1.0" fill-rule="evenodd" stroke-linejoin="round"></path><path d="M162.2,108.3L162.2,21.7L104.4,21.7L104.4,108.3L162.2,108.3Z" fill="var(--sel)" fill-opacity="1.0" stroke="var(--rule)" stroke-width="1.0" fill-rule="evenodd" stroke-linejoin="round"></path><text class="lbl" x="61.1" y="69.0" text-anchor="middle">built</text><text class="lbl" x="133.3" y="69.0" text-anchor="middle">green</text></g><text class="cap-b" x="438.0" y="170.0">Categorical: shares</text><text class="cap" x="438.0" y="183.0">Categorical values (land use)</text><text class="cap" x="438.0" y="196.0">become shares of each class:</text><text class="cap" x="438.0" y="209.0">60% built, 40% green.</text></svg>