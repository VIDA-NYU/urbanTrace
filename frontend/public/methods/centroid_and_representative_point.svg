<svg xmlns="http://www.w3.org/2000/svg" class="uwfig" width="424" height="220" viewBox="0 0 424 220" role="img" aria-label="One point per polygon"><style>
.uwfig { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#333333; --muted:#898781; --rule:#c3c2b7; --cell:#efefef;
  --pt:#bfbfbf; --src:#eb6834; --src-fill:#fbd9cb; --tgt:#2a78d6; --tgt-fill:#cde2fb; --sel:#9ec5f4;
  --axis-x:#d03b3b; --axis-y:#008300; --hatch:#c3c2b7 }
@media (prefers-color-scheme: dark) { .uwfig { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
  --rule:#52514e; --cell:#2c2c2a; --pt:#52514e; --src:#d95926; --src-fill:#5a2a17; --tgt:#3987e5;
  --tgt-fill:#1c3a5e; --sel:#256abf; --axis-x:#e66767; --axis-y:#0ca30c; --hatch:#52514e } }
.uwfig text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 10.5px }
.uwfig .title { fill: var(--ink); font-size: 13px; font-weight: 600 }
.uwfig .cap { fill: var(--ink2); font-size: 11px }
.uwfig .cap-b { fill: var(--ink); font-size: 11px; font-weight: 600 }
.uwfig .lbl { fill: var(--ink); font-size: 10.5px; paint-order: stroke; stroke: var(--surface); stroke-width: 3px }
.uwfig .small { fill: var(--muted); font-size: 9.5px }
.uwfig .val { fill: var(--ink); font-size: 9px; paint-order: stroke; stroke: var(--surface); stroke-width: 2.5px }
.uwfig .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: var(--ink2) }
</style><defs><pattern id="fig-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--surface)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--hatch)" stroke-width="2"/></pattern><marker id="fig-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--ink2)"/></marker></defs><rect width="424" height="220" fill="var(--surface)"/><text class="title" x="4" y="17">One point per polygon</text><g transform="translate(4.0,26.0)"><rect width="200" height="130" rx="6" fill="var(--surface)" stroke="var(--rule)"/><path d="M169.7,17.6L169.7,113.8L30.3,113.8L30.3,17.6L72.1,17.6L72.1,85.9L127.9,85.9L127.9,17.6L169.7,17.6Z" fill="var(--tgt-fill)" fill-opacity="0.25" stroke="var(--tgt)" stroke-width="1.8" fill-rule="evenodd" stroke-linejoin="round"></path><path d="M162.8,23.2L162.8,106.8L37.2,106.8L37.2,23.2L79.1,23.2L79.1,78.9L120.9,78.9L120.9,23.2L162.8,23.2Z" fill="var(--src-fill)" fill-opacity="0.85" stroke="var(--src)" stroke-width="1.8" fill-rule="evenodd" stroke-linejoin="round"></path><path d="M127.9,85.9L127.9,17.6L72.1,17.6L72.1,85.9L127.9,85.9Z" fill="var(--tgt-fill)" fill-opacity="0.45" stroke="var(--tgt)" stroke-width="1.8" fill-rule="evenodd" stroke-linejoin="round"></path><text class="small" x="100.0" y="34.1" text-anchor="middle">courtyard</text><text class="small" x="148.8" y="23.0" text-anchor="middle">building</text><circle cx="100.0" cy="69.0" r="5" fill="var(--pt)" stroke="var(--ink2)" stroke-width="1.2"/><text class="lbl" x="100.0" y="60.0" text-anchor="middle">centroid</text></g><text class="cap-b" x="6.0" y="170.0">centroid</text><text class="cap" x="6.0" y="183.0">The geometric centre, which can</text><text class="cap" x="6.0" y="196.0">fall outside a concave shape: the</text><text class="cap" x="6.0" y="209.0">lot goes to the courtyard.</text><g transform="translate(220.0,26.0)"><rect width="200" height="130" rx="6" fill="var(--surface)" stroke="var(--rule)"/><path d="M169.7,17.6L169.7,113.8L30.3,113.8L30.3,17.6L72.1,17.6L72.1,85.9L127.9,85.9L127.9,17.6L169.7,17.6Z" fill="var(--tgt-fill)" fill-opacity="0.25" stroke="var(--tgt)" stroke-width="1.8" fill-rule="evenodd" stroke-linejoin="round"></path><path d="M162.8,23.2L162.8,106.8L37.2,106.8L37.2,23.2L79.1,23.2L79.1,78.9L120.9,78.9L120.9,23.2L162.8,23.2Z" fill="var(--src-fill)" fill-opacity="0.85" stroke="var(--src)" stroke-width="1.8" fill-rule="evenodd" stroke-linejoin="round"></path><path d="M127.9,85.9L127.9,17.6L72.1,17.6L72.1,85.9L127.9,85.9Z" fill="var(--tgt-fill)" fill-opacity="0.45" stroke="var(--tgt)" stroke-width="1.8" fill-rule="evenodd" stroke-linejoin="round"></path><text class="small" x="100.0" y="34.1" text-anchor="middle">courtyard</text><text class="small" x="148.8" y="23.0" text-anchor="middle">building</text><circle cx="58.2" cy="51.1" r="5" fill="var(--pt)" stroke="var(--ink2)" stroke-width="1.2"/><text class="lbl" x="58.2" y="42.1" text-anchor="middle">representative point</text></g><text class="cap-b" x="222.0" y="170.0">representative_point</text><text class="cap" x="222.0" y="183.0">A point guaranteed inside the</text><text class="cap" x="222.0" y="196.0">polygon: the lot goes to the</text><text class="cap" x="222.0" y="209.0">building.</text></svg>