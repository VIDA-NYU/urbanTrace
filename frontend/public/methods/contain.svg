<svg xmlns="http://www.w3.org/2000/svg" class="uwfig" width="228" height="226" viewBox="0 0 228 226" role="img" aria-label=""><style>
.uwfig { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#333333; --muted:#898781; --rule:#c3c2b7; --cell:#efefef;
  --pt:#bfbfbf; --src:#eb6834; --src-fill:#fbd9cb; --tgt:#2a78d6; --tgt-fill:#cde2fb; --sel:#9ec5f4;
  --axis-x:#d03b3b; --axis-y:#008300; --hatch:#c3c2b7 }
@media (prefers-color-scheme: dark) { .uwfig { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
  --rule:#52514e; --cell:#2c2c2a; --pt:#52514e; --src:#d95926; --src-fill:#5a2a17; --tgt:#3987e5;
  --tgt-fill:#1c3a5e; --sel:#256abf; --axis-x:#e66767; --axis-y:#0ca30c; --hatch:#52514e } }
.uwfig text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 10.5px }
.uwfig .title { fill: var(--ink); font-size: 13px; font-weight: 600 }
.uwfig .cap { fill: var(--ink2); font-size: 11px }
.uwfig .cap-b { fill: var(--ink); font-size: 11px; font-weight: 600 }
.uwfig .lbl { fill: var(--ink); font-size: 10.5px; paint-order: stroke; stroke: var(--surface); stroke-width: 3px }
.uwfig .small { fill: var(--muted); font-size: 9.5px }
.uwfig .val { fill: var(--ink); font-size: 9px; paint-order: stroke; stroke: var(--surface); stroke-width: 2.5px }
.uwfig .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: var(--ink2) }
</style><defs><pattern id="fig-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--surface)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--hatch)" stroke-width="2"/></pattern><marker id="fig-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--ink2)"/></marker></defs><rect width="228" height="226" fill="var(--surface)"/><g transform="translate(4.0,6.0)"><rect width="220" height="130" rx="6" fill="var(--surface)" stroke="var(--rule)"/><path d="M110.0,111.8L110.0,18.2L32.1,18.2L32.1,111.8L110.0,111.8Z" fill="var(--tgt-fill)" fill-opacity="1.0" stroke="var(--tgt)" stroke-width="1.8" fill-rule="evenodd" stroke-linejoin="round"></path><text class="lbl" x="71.0" y="37.8" text-anchor="middle">A</text><path d="M187.9,111.8L187.9,18.2L110.0,18.2L110.0,111.8L187.9,111.8Z" fill="var(--tgt-fill)" fill-opacity="1.0" stroke="var(--tgt)" stroke-width="1.8" fill-rule="evenodd" stroke-linejoin="round"></path><text class="lbl" x="149.0" y="37.8" text-anchor="middle">B</text><circle cx="63.2" cy="57.2" r="5.0" fill="var(--src)" stroke="var(--surface)" stroke-width="1.2"/><text class="lbl" x="71.2" y="61.2" text-anchor="start">p1 → A</text><circle cx="156.8" cy="80.6" r="5.0" fill="var(--src)" stroke="var(--surface)" stroke-width="1.2"/><text class="lbl" x="164.8" y="84.6" text-anchor="start">p2 → B</text><circle cx="110.0" cy="65.0" r="5.0" fill="var(--src)" stroke="var(--surface)" stroke-width="1.2"/><text class="lbl" x="118.0" y="69.0" text-anchor="start">on edge → A</text></g><text class="cap-b" x="6.0" y="150.0">contain</text><text class="cap" x="6.0" y="163.0">Each point goes to the polygon</text><text class="cap" x="6.0" y="176.0">containing it. A point on a shared</text><text class="cap" x="6.0" y="189.0">edge goes to one polygon only, the</text><text class="cap" x="6.0" y="202.0">lowest ID (A), so it is never counted</text><text class="cap" x="6.0" y="215.0">twice.</text></svg>