<svg xmlns="http://www.w3.org/2000/svg" class="uwfig" width="464" height="478" viewBox="0 0 464 478" role="img" aria-label="Raster values along streets"><style>
.uwfig { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#333333; --muted:#898781; --rule:#c3c2b7; --cell:#efefef;
  --pt:#bfbfbf; --src:#eb6834; --src-fill:#fbd9cb; --tgt:#2a78d6; --tgt-fill:#cde2fb; --sel:#9ec5f4;
  --axis-x:#d03b3b; --axis-y:#008300; --hatch:#c3c2b7 }
@media (prefers-color-scheme: dark) { .uwfig { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
  --rule:#52514e; --cell:#2c2c2a; --pt:#52514e; --src:#d95926; --src-fill:#5a2a17; --tgt:#3987e5;
  --tgt-fill:#1c3a5e; --sel:#256abf; --axis-x:#e66767; --axis-y:#0ca30c; --hatch:#52514e } }
.uwfig text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 10.5px }
.uwfig .title { fill: var(--ink); font-size: 13px; font-weight: 600 }
.uwfig .cap { fill: var(--ink2); font-size: 11px }
.uwfig .cap-b { fill: var(--ink); font-size: 11px; font-weight: 600 }
.uwfig .lbl { fill: var(--ink); font-size: 10.5px; paint-order: stroke; stroke: var(--surface); stroke-width: 3px }
.uwfig .small { fill: var(--muted); font-size: 9.5px }
.uwfig .val { fill: var(--ink); font-size: 9px; paint-order: stroke; stroke: var(--surface); stroke-width: 2.5px }
.uwfig .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: var(--ink2) }
</style><defs><pattern id="fig-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--surface)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--hatch)" stroke-width="2"/></pattern><marker id="fig-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--ink2)"/></marker></defs><rect width="464" height="478" fill="var(--surface)"/><text class="title" x="4" y="17">Raster values along streets</text><g transform="translate(4.0,26.0)"><rect width="240" height="110" rx="6" fill="var(--surface)" stroke="var(--rule)"/><rect x="34.0" y="30.9" width="43.0" height="43.0" fill="var(--cell)" stroke="var(--rule)"/><rect x="34.0" y="30.9" width="43.0" height="43.0" fill="var(--ink2)" fill-opacity="0.15" stroke="var(--rule)"/><text class="val" x="55.5" y="55.4" text-anchor="middle">10</text><text class="small" x="55.5" y="88.2" text-anchor="middle">20 m</text><rect x="77.0" y="30.9" width="43.0" height="43.0" fill="var(--cell)" stroke="var(--rule)"/><rect x="77.0" y="30.9" width="43.0" height="43.0" fill="var(--ink2)" fill-opacity="0.15" stroke="var(--rule)"/><text class="val" x="98.5" y="55.4" text-anchor="middle">10</text><text class="small" x="98.5" y="88.2" text-anchor="middle">25 m</text><rect x="120.0" y="30.9" width="43.0" height="43.0" fill="var(--cell)" stroke="var(--rule)"/><rect x="120.0" y="30.9" width="43.0" height="43.0" fill="var(--ink2)" fill-opacity="0.55" stroke="var(--rule)"/><text class="val" x="141.5" y="55.4" text-anchor="middle">30</text><text class="small" x="141.5" y="88.2" text-anchor="middle">25 m</text><rect x="163.0" y="30.9" width="43.0" height="43.0" fill="var(--cell)" stroke="var(--rule)"/><rect x="163.0" y="30.9" width="43.0" height="43.0" fill="var(--ink2)" fill-opacity="0.35" stroke="var(--rule)"/><text class="val" x="184.5" y="55.4" text-anchor="middle">20</text><text class="small" x="184.5" y="88.2" text-anchor="middle">20 m</text><polyline points="42.6,65.3 197.4,65.3" fill="none" stroke="var(--tgt)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></polyline><text class="lbl" x="120.0" y="15.2" text-anchor="middle">mean = Σ value × m / Σ m = 17.8</text></g><text class="cap-b" x="6.0" y="150.0">along_lines</text><text class="cap" x="6.0" y="163.0">along_lines: the line&#x27;s length in each</text><text class="cap" x="6.0" y="176.0">cell weights the cell&#x27;s value: a mean by</text><text class="cap" x="6.0" y="189.0">valid length.</text><g transform="translate(260.0,26.0)"><rect width="200" height="130" rx="6" fill="var(--surface)" stroke="var(--rule)"/><path d="M100.0,65.0L100.0,19.3L54.3,19.3L54.3,65.0L100.0,65.0Z" fill="var(--cell)" fill-opacity="1.0" stroke="var(--rule)" stroke-width="1.0" fill-rule="evenodd" stroke-linejoin="round"></path><text class="val" x="77.2" y="45.2" text-anchor="middle">1</text><path d="M145.7,65.0L145.7,19.3L100.0,19.3L100.0,65.0L145.7,65.0Z" fill="var(--cell)" fill-opacity="1.0" stroke="var(--rule)" stroke-width="1.0" fill-rule="evenodd" stroke-linejoin="round"></path><text class="val" x="122.8" y="45.2" text-anchor="middle">2</text><path d="M100.0,110.7L100.0,65.0L54.3,65.0L54.3,110.7L100.0,110.7Z" fill="var(--cell)" fill-opacity="1.0" stroke="var(--rule)" stroke-width="1.0" fill-rule="evenodd" stroke-linejoin="round"></path><text class="val" x="77.2" y="90.8" text-anchor="middle">3</text><path d="M145.7,110.7L145.7,65.0L100.0,65.0L100.0,110.7L145.7,110.7Z" fill="var(--cell)" fill-opacity="1.0" stroke="var(--rule)" stroke-width="1.0" fill-rule="evenodd" stroke-linejoin="round"></path><text class="val" x="122.8" y="90.8" text-anchor="middle">4</text><path d="M145.7,110.7L145.7,19.3L100.0,19.3L100.0,110.7L145.7,110.7Z" fill="var(--sel)" fill-opacity="0.5" stroke="var(--rule)" stroke-width="1.0" fill-rule="evenodd" stroke-linejoin="round"></path><polyline points="100.0,105.2 100.0,24.8" fill="none" stroke="var(--tgt)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></polyline></g><text class="cap-b" x="262.0" y="170.0">Lines on a cell edge</text><text class="cap" x="262.0" y="183.0">A line exactly on a cell edge</text><text class="cap" x="262.0" y="196.0">belongs to one cell: a cell owns</text><text class="cap" x="262.0" y="209.0">its west and north edges, so here</text><text class="cap" x="262.0" y="222.0">the east cells. Its length counts</text><text class="cap" x="262.0" y="235.0">once.</text><g transform="translate(4.0,258.0)"><rect width="210" height="130" rx="6" fill="var(--surface)" stroke="var(--rule)"/><path d="M122.2,108.1L122.2,21.9L18.9,21.9L18.9,108.1L122.2,108.1Z" fill="var(--cell)" fill-opacity="1.0" stroke="var(--rule)" stroke-width="1.0" fill-rule="evenodd" stroke-linejoin="round"></path><path d="M191.1,108.1L191.1,21.9L122.2,21.9L122.2,108.1L191.1,108.1Z" fill="var(--cell)" fill-opacity="1.0" stroke="var(--rule)" stroke-width="1.0" fill-rule="evenodd" stroke-linejoin="round"></path><text class="lbl" x="27.5" y="38.0" text-anchor="start">z1</text><text class="lbl" x="130.8" y="38.0" text-anchor="start">z2</text><polyline points="32.7,70.2 122.2,70.2" fill="none" stroke="var(--tgt)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></polyline><polyline points="122.2,70.2 182.5,70.2" fill="none" stroke="var(--src)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></polyline><circle cx="122.2" cy="70.2" r="3.5" fill="var(--pt)" stroke="var(--ink2)" stroke-width="1.2"/><text class="lbl" x="77.4" y="61.2" text-anchor="middle">main|z1</text><text class="lbl" x="153.2" y="61.2" text-anchor="middle">main|z2</text></g><text class="cap-b" x="6.0" y="402.0">split_lines</text><text class="cap" x="6.0" y="415.0">split_lines cuts lines at zone</text><text class="cap" x="6.0" y="428.0">boundaries into pieces with stable</text><text class="cap" x="6.0" y="441.0">IDs (line|zone); pieces are</text><text class="cap" x="6.0" y="454.0">summarised, then pooled per zone</text><text class="cap" x="6.0" y="467.0">with ratio_of_sums.</text></svg>