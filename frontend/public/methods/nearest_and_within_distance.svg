<svg xmlns="http://www.w3.org/2000/svg" class="uwfig" width="444" height="246" viewBox="0 0 444 246" role="img" aria-label="Distance-based matching"><style>
.uwfig { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#333333; --muted:#898781; --rule:#c3c2b7; --cell:#efefef;
  --pt:#bfbfbf; --src:#eb6834; --src-fill:#fbd9cb; --tgt:#2a78d6; --tgt-fill:#cde2fb; --sel:#9ec5f4;
  --axis-x:#d03b3b; --axis-y:#008300; --hatch:#c3c2b7 }
@media (prefers-color-scheme: dark) { .uwfig { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
  --rule:#52514e; --cell:#2c2c2a; --pt:#52514e; --src:#d95926; --src-fill:#5a2a17; --tgt:#3987e5;
  --tgt-fill:#1c3a5e; --sel:#256abf; --axis-x:#e66767; --axis-y:#0ca30c; --hatch:#52514e } }
.uwfig text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 10.5px }
.uwfig .title { fill: var(--ink); font-size: 13px; font-weight: 600 }
.uwfig .cap { fill: var(--ink2); font-size: 11px }
.uwfig .cap-b { fill: var(--ink); font-size: 11px; font-weight: 600 }
.uwfig .lbl { fill: var(--ink); font-size: 10.5px; paint-order: stroke; stroke: var(--surface); stroke-width: 3px }
.uwfig .small { fill: var(--muted); font-size: 9.5px }
.uwfig .val { fill: var(--ink); font-size: 9px; paint-order: stroke; stroke: var(--surface); stroke-width: 2.5px }
.uwfig .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: var(--ink2) }
</style><defs><pattern id="fig-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--surface)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--hatch)" stroke-width="2"/></pattern><marker id="fig-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--ink2)"/></marker></defs><rect width="444" height="246" fill="var(--surface)"/><text class="title" x="4" y="17">Distance-based matching</text><g transform="translate(4.0,26.0)"><rect width="220" height="130" rx="6" fill="var(--surface)" stroke="var(--rule)"/><circle cx="71.0" cy="65.0" r="39.0" fill="none" fill-opacity="0.35" stroke="var(--muted)" stroke-width="1.0" stroke-dasharray="4 3"/><circle cx="149.0" cy="57.2" r="39.0" fill="none" fill-opacity="0.35" stroke="var(--muted)" stroke-width="1.0" stroke-dasharray="4 3"/><polyline points="47.6,49.4 71.0,65.0" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round"/><circle cx="47.6" cy="49.4" r="4.5" fill="var(--src)" stroke="var(--surface)" stroke-width="1.2"/><polyline points="94.4,83.7 71.0,65.0" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round"/><circle cx="94.4" cy="83.7" r="4.5" fill="var(--src)" stroke="var(--surface)" stroke-width="1.2"/><circle cx="110.0" cy="30.7" r="4.5" fill="var(--src)" stroke="var(--surface)" stroke-width="1.2"/><path d="M106.5,27.2L113.5,34.2M106.5,34.2L113.5,27.2" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/><circle cx="180.1" cy="104.0" r="4.5" fill="var(--src)" stroke="var(--surface)" stroke-width="1.2"/><path d="M176.6,100.5L183.6,107.5M176.6,107.5L183.6,100.5" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/><polyline points="128.7,68.1 149.0,57.2" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round"/><circle cx="128.7" cy="68.1" r="4.5" fill="var(--src)" stroke="var(--surface)" stroke-width="1.2"/><circle cx="71.0" cy="65.0" r="6" fill="var(--tgt)" stroke="var(--surface)" stroke-width="1.2"/><text class="lbl" x="79.0" y="69.0" text-anchor="start">S1</text><circle cx="149.0" cy="57.2" r="6" fill="var(--tgt)" stroke="var(--surface)" stroke-width="1.2"/><text class="lbl" x="157.0" y="61.2" text-anchor="start">S2</text></g><text class="cap-b" x="6.0" y="170.0">nearest, max_distance = 25 m</text><text class="cap" x="6.0" y="183.0">nearest: each crash to its nearest</text><text class="cap" x="6.0" y="196.0">stop, within max_distance (dashed).</text><text class="cap" x="6.0" y="209.0">Beyond it (×), a crash is reported as</text><text class="cap" x="6.0" y="222.0">unmatched, not forced onto a far</text><text class="cap" x="6.0" y="235.0">stop.</text><g transform="translate(240.0,26.0)"><rect width="200" height="130" rx="6" fill="var(--surface)" stroke="var(--rule)"/><circle cx="100.0" cy="65.0" r="46.8" fill="none" fill-opacity="0.35" stroke="var(--muted)" stroke-width="1.0" stroke-dasharray="4 3"/><polyline points="100.0,65.0 61.0,65.0" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round"/><circle cx="61.0" cy="65.0" r="6" fill="var(--tgt)" stroke="var(--surface)" stroke-width="1.2"/><text class="lbl" x="69.0" y="69.0" text-anchor="start">S1</text><polyline points="100.0,65.0 139.0,57.2" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-linecap="round"/><circle cx="139.0" cy="57.2" r="6" fill="var(--tgt)" stroke="var(--surface)" stroke-width="1.2"/><text class="lbl" x="147.0" y="61.2" text-anchor="start">S2</text><circle cx="100.0" cy="65.0" r="5" fill="var(--src)" stroke="var(--surface)" stroke-width="1.2"/><text class="lbl" x="100.0" y="55.0" text-anchor="middle">0.5 | 0.5</text></g><text class="cap-b" x="242.0" y="170.0">within_distance</text><text class="cap" x="242.0" y="183.0">within_distance: a crash within</text><text class="cap" x="242.0" y="196.0">30 m of two stops is split</text><text class="cap" x="242.0" y="209.0">between them (0.5 each) with</text><text class="cap" x="242.0" y="222.0">split=True, or counted whole at</text><text class="cap" x="242.0" y="235.0">both with split=False.</text></svg>