name: CI

on:
  push:
    branches: [main, autark-map]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      # The catalog lives in Git LFS (about 17.7 GB); the tests use synthetic fixtures, so it is not fetched.
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r backend/requirements-dev.txt
      - name: Test
        working-directory: backend
        env:
          COPILOT_DISABLED: "1"
        run: python -m pytest -q
